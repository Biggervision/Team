<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#F1F5F9"/>
  <circle cx="48" cy="48" r="22" fill="#DC2626"/>
  <text x="48" y="56" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <text x="84" y="42" font-size="20" font-weight="bold" fill="#0F172A">Authorize (first run only)</text>
  <text x="84" y="64" font-size="15" fill="#475569">Three quick screens. The "unverified app" warning is NORMAL — it is your own script in your own account.</text>

  <!-- panel A -->
  <rect x="30" y="100" width="280" height="360" rx="12" fill="#fff" stroke="#CBD5E1"/>
  <text x="170" y="140" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Authorization required</text>
  <text x="170" y="175" font-size="12" fill="#475569" text-anchor="middle">This project requires your</text>
  <text x="170" y="192" font-size="12" fill="#475569" text-anchor="middle">permission to run.</text>
  <rect x="70" y="230" width="200" height="40" rx="20" fill="#1A73E8"/>
  <text x="170" y="255" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Continue</text>
  <ellipse cx="170" cy="250" rx="112" ry="28" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="170" y="310" font-size="12" fill="#64748B" text-anchor="middle">then pick your</text>
  <text x="170" y="327" font-size="12" fill="#64748B" text-anchor="middle">Google account</text>
  <circle cx="150" cy="365" r="16" fill="#4F46E5"/>
  <text x="150" y="371" font-size="13" fill="#fff" text-anchor="middle">B</text>
  <text x="178" y="370" font-size="12" fill="#334155">you@…</text>

  <path d="M 318 280 L 352 280" stroke="#0F172A" stroke-width="3" marker-end="url(#arr5)"/>

  <!-- panel B -->
  <rect x="360" y="100" width="280" height="360" rx="12" fill="#fff" stroke="#CBD5E1"/>
  <text x="500" y="140" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Google hasn't verified</text>
  <text x="500" y="160" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">this app</text>
  <text x="500" y="195" font-size="12" fill="#475569" text-anchor="middle">Normal for personal scripts —</text>
  <text x="500" y="212" font-size="12" fill="#475569" text-anchor="middle">this is your own code.</text>
  <text x="420" y="260" font-size="13" font-weight="bold" fill="#1A73E8">Advanced ▾</text>
  <ellipse cx="458" cy="255" rx="52" ry="18" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="420" y="300" font-size="13" fill="#1A73E8" text-decoration="underline">Go to Untitled project (unsafe)</text>
  <ellipse cx="512" cy="295" rx="104" ry="18" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="500" y="350" font-size="11" fill="#94A3B8" text-anchor="middle">① click Advanced</text>
  <text x="500" y="367" font-size="11" fill="#94A3B8" text-anchor="middle">② click "Go to … (unsafe)"</text>

  <path d="M 648 280 L 682 280" stroke="#0F172A" stroke-width="3" marker-end="url(#arr5)"/>

  <!-- panel C -->
  <rect x="690" y="100" width="240" height="360" rx="12" fill="#fff" stroke="#CBD5E1"/>
  <text x="810" y="140" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Project wants access</text>
  <text x="810" y="175" font-size="12" fill="#475569" text-anchor="middle">See, edit, create and delete</text>
  <text x="810" y="192" font-size="12" fill="#475569" text-anchor="middle">this spreadsheet</text>
  <rect x="740" y="230" width="140" height="40" rx="20" fill="#1A73E8"/>
  <text x="810" y="255" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Allow</text>
  <ellipse cx="810" cy="250" rx="84" ry="28" fill="none" stroke="#DC2626" stroke-width="3"/>

  <defs><marker id="arr5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0F172A"/></marker></defs>

  <rect x="30" y="490" width="900" height="90" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="52" y="522" font-size="14" fill="#9A3412"><tspan font-weight="bold">If the build was interrupted by this authorization flow:</tspan>  simply click</text>
  <text x="52" y="546" font-size="14" fill="#9A3412">⚡ Executive OS → Build / Rebuild System  <tspan font-weight="bold">once more</tspan> — it will now run straight through.</text>
</svg>
