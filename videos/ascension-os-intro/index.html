<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --navy: #0f172a;
        --navy-2: #1e293b;
        --teal: #2bb5ae;
        --indigo: #6366f1;
        --amber: #f59e0b;
        --ink: #f8fafc;
        --muted: #94a3b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
      }
      #stage {
        position: absolute;
        inset: 0;
        background: radial-gradient(1200px 700px at 50% 45%, var(--navy-2) 0%, var(--navy) 70%);
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        padding: 120px 160px;
      }

      /* Scene 1 — the 168-hour grid */
      #s1-count {
        font-size: 220px;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #s1-grid {
        display: grid;
        grid-template-columns: repeat(24, 40px);
        grid-template-rows: repeat(7, 40px);
        gap: 8px;
      }
      .cell {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: var(--teal);
      }
      #s1-label {
        font-size: 56px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--muted);
      }
      #s1-label .hl {
        color: var(--teal);
      }

      /* Scene 2 — the operating loop */
      #s2-loop {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .step {
        display: block;
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #475569;
      }
      .arrow {
        display: block;
        font-size: 60px;
        font-weight: 700;
        color: var(--muted);
      }
      #s2-bar {
        width: 1400px;
        height: 10px;
        border-radius: 5px;
        background: var(--navy-2);
        overflow: hidden;
      }
      #s2-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--indigo));
        transform-origin: left center;
      }

      /* Scene 3 — lockup */
      #s3-lockup {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      #s3-bolt {
        display: block;
        width: 150px;
        height: 200px;
      }
      #s3-word {
        display: flex;
        font-size: 168px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #s3-word .ch {
        display: block;
      }
      #s3-word .os {
        color: var(--teal);
      }
      #s3-word .sp {
        width: 48px;
      }
      #s3-rule {
        width: 900px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--teal), var(--indigo));
        transform-origin: left center;
      }
      #s3-tag {
        font-size: 48px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div data-hf-id="hf-cyer" id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div data-hf-id="hf-yihu" id="s1" class="scene">
          <div data-hf-id="hf-pfc5" id="s1-count">0</div>
          <div data-hf-id="hf-9btm" id="s1-grid"></div>
          <div data-hf-id="hf-e37v" id="s1-label">hours in every week. <span data-hf-id="hf-sj2s" class="hl">Spend them on purpose.</span></div>
        </div>

        <div data-hf-id="hf-ukdt" id="s2" class="scene">
          <div data-hf-id="hf-9261" id="s2-loop">
            <span data-hf-id="hf-2xw9" class="step" id="st-0">Design</span>
            <span data-hf-id="hf-ozoe" class="arrow" id="ar-0">→</span>
            <span data-hf-id="hf-j9av" class="step" id="st-1">Commit</span>
            <span data-hf-id="hf-ts15" class="arrow" id="ar-1">→</span>
            <span data-hf-id="hf-s43w" class="step" id="st-2">Execute</span>
            <span data-hf-id="hf-6jj4" class="arrow" id="ar-2">→</span>
            <span data-hf-id="hf-t79w" class="step" id="st-3">Review</span>
          </div>
          <div data-hf-id="hf-kc1y" id="s2-bar"><div data-hf-id="hf-qt3k" id="s2-fill"></div></div>
        </div>

        <div data-hf-id="hf-tsq0" id="s3" class="scene">
          <div data-hf-id="hf-et2m" id="s3-lockup">
            <svg data-hf-id="hf-1hgh" id="s3-bolt" viewBox="0 0 30 40" aria-hidden="true">
              <path data-hf-id="hf-hj6t" id="s3-bolt-path" d="M18 2 L4 23 H14 L11 38 L26 15 H16 Z" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            <div data-hf-id="hf-1hnc" id="s3-word"></div>
          </div>
          <div data-hf-id="hf-9bga" id="s3-rule"></div>
          <div data-hf-id="hf-bsp7" id="s3-tag">The Executive 168-Hour Operating System</div>
        </div>
      </div>
      <audio id="vo-l1" src="assets/vo/l1.wav" data-start="0.25" data-duration="1.54" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-l2" src="assets/vo/l2.wav" data-start="1.9" data-duration="1.12" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-design" src="assets/vo/w-Design.wav" data-start="3.72" data-duration="0.55" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-commit" src="assets/vo/w-Commit.wav" data-start="4.3" data-duration="0.47" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-execute" src="assets/vo/w-Execute.wav" data-start="4.85" data-duration="0.68" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-review" src="assets/vo/w-Review.wav" data-start="5.58" data-duration="0.53" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-l3" src="assets/vo/l3.wav" data-start="6.85" data-duration="2.27" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      // Build DOM deterministically before the timeline.
      const grid = document.getElementById("s1-grid");
      for (let i = 0; i < 168; i++) {
        const c = document.createElement("div");
        c.className = "cell";
        grid.appendChild(c);
      }
      const word = document.getElementById("s3-word");
      "ASCENSION OS".split("").forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch" + (ch === " " ? " sp" : "") + (i >= 10 ? " os" : "");
        s.textContent = ch === " " ? "" : ch;
        word.appendChild(s);
      });

      const C = { teal: "#2BB5AE", ink: "#F8FAFC", dim: "#1E293B", muted: "#94A3B8" };
      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0 – 3.3s): 168 cells fill as the counter climbs ──
      tl.fromTo("#s1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 0);
      tl.fromTo(
        "#s1-count",
        { autoAlpha: 0, scale: 0.7 },
        { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2)" },
        0.05,
      );
      tl.fromTo(
        ".cell",
        { autoAlpha: 0.08, scale: 0.4 },
        { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power2.out", stagger: { each: 1.3 / 168 } },
        0.2,
      );
      const counter = { v: 0 };
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 168,
          duration: 1.5,
          ease: "power1.inOut",
          onUpdate: () => {
            document.getElementById("s1-count").textContent = Math.round(counter.v);
          },
        },
        0.2,
      );
      tl.fromTo(
        "#s1-label",
        { autoAlpha: 0, y: 40 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.5,
      );
      tl.to("#s1-count", { color: C.teal, scale: 1.08, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.72);
      tl.to("#s1", { autoAlpha: 0, scale: 0.94, duration: 0.4, ease: "power2.in" }, 2.9);

      // ── Scene 2 (3.3 – 6.6s): the operating loop lights up step by step ──
      tl.fromTo("#s2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, 3.3);
      tl.fromTo(
        ".step, .arrow",
        { autoAlpha: 0, y: 60 },
        { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 },
        3.3,
      );
      tl.fromTo("#s2-fill", { scaleX: 0 }, { scaleX: 1, duration: 2.2, ease: "none" }, 3.7);
      const lightAt = [3.75, 4.32, 4.87, 5.6]; // synced to the spoken words
      for (let i = 0; i < 4; i++) {
        const t = lightAt[i];
        tl.to(`#st-${i}`, { color: C.ink, duration: 0.2, ease: "power2.out" }, t);
        tl.to(`#st-${i}`, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
        if (i < 3) tl.to(`#ar-${i}`, { color: C.teal, duration: 0.2 }, t + 0.25);
      }
      tl.to("#st-3", { color: C.teal, duration: 0.2 }, 5.8);
      tl.to("#s2", { autoAlpha: 0, y: -40, duration: 0.4, ease: "power2.in" }, 6.2);

      // ── Scene 3 (6.6 – 10s): ⚡ ASCENSION OS lockup, then hold ──
      tl.fromTo("#s3", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, 6.6);
      tl.fromTo(
        "#s3-bolt",
        { autoAlpha: 0, scale: 0.3, rotation: -25 },
        { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" },
        6.6,
      );
      tl.fromTo(
        "#s3-word .ch",
        { autoAlpha: 0, y: 90 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power4.out", stagger: 0.04 },
        6.8,
      );
      tl.fromTo("#s3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 7.5);
      tl.fromTo(
        "#s3-tag",
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" },
        7.8,
      );
      tl.to(
        "#s3-bolt-path",
        { attr: { fill: "#FCD34D" }, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" },
        8.4,
      );
      tl.fromTo("#s3-lockup", { scale: 1 }, { scale: 1.025, duration: 2.6, ease: "sine.inOut" }, 7.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
